name: Deploy Weather App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate runtime configuration
        env:
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
        run: |
          test -n "$WEATHER_KEY"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {"OPENWEATHER_API_KEY": os.environ["WEATHER_KEY"]}
          Path("config.js").write_text(
              "window.WEATHER_CONFIG = " + json.dumps(config) + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
