<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A client-side weather forecast app with live weather data, forecasts, charts, visual effects, and ambient sounds.">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Weather Forecast</h1>

        <!-- Search and controls -->
        <label class="sr-only" for="cityInput">City name</label>
        <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off">
        <button id="getWeatherBtn" type="button">🔍 Get Weather</button>
        <button id="geoBtn" type="button">📍 Use My Location</button>
        <button id="unitToggleBtn" type="button">🔃 Switch to °F</button>
        <button id="muteBtn" type="button">🔊 Mute</button>

        <!-- Weather effects container -->
        <div class="effects-container" aria-hidden="true"></div>

        <!-- Weather info output -->
        <section id="weatherResult" aria-live="polite" aria-atomic="true"></section>

        <!-- Weather Charts -->
        <section class="charts-container" aria-labelledby="chartsTitle">
            <h2 id="chartsTitle">Weather Charts</h2>
            <div class="chart-wrapper">
                <canvas id="tempChart" aria-label="Temperature forecast chart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="windChart" aria-label="Wind speed forecast chart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="rainChart" aria-label="Rain volume forecast chart"></canvas>
            </div>
        </section>
    </main>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Generated during the GitHub Pages deployment, or created locally from config.example.js. -->
    <script src="config.js"></script>
    <script src="script.js"></script>

    <script>
        const cityInput = document.getElementById("cityInput");
        const getWeatherBtn = document.getElementById("getWeatherBtn");
        const geoBtn = document.getElementById("geoBtn");
        const unitToggleBtn = document.getElementById("unitToggleBtn");

        getWeatherBtn.addEventListener("click", () => getWeather());
        geoBtn.addEventListener("click", () => getWeather(true));
        unitToggleBtn.addEventListener("click", toggleUnit);

        cityInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                getWeather();
            }
        });

        // Mute/unmute ambient sounds
        const muteBtn = document.getElementById("muteBtn");
        let isMuted = false;
        muteBtn.addEventListener("click", () => {
            isMuted = !isMuted;
            muteBtn.innerText = isMuted ? "🔇 Muted" : "🔊 Unmute";
            for (const sound of Object.values(ambientSounds)) {
                sound.muted = isMuted;
            }
        });
    </script>
</body>
</html>
